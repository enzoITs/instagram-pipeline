services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the container the app must listen on all interfaces.
      HOST: 0.0.0.0
      DATABASE_URL: sqlite:////app/data/instagram_pipeline.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # The scheduler runs inside the web process and takes a database lock, so
    # extra replicas would contend rather than duplicate work — but a single
    # instance is the intended shape for this app.
    deploy:
      replicas: 1
