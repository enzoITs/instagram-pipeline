[project]
name = "instagram-engagement-analyzer"
version = "1.0.0"
description = "Instagram video engagement analysis with NLP and AI insights"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that download/run real Hugging Face models (opt-in with RUN_MODEL_TESTS=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["alembic/", "tests/"]
