[project]
name = "instagram-pipeline"
version = "1.0.0"
description = "Coleta automatizada e histórico de métricas de engajamento do Instagram via Meta Graph API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Long lines are only flagged by the formatter's own rule, which is not on.
    "E501",
    # FastAPI's dependency injection is expressed as function-call defaults.
    "B008",
    # The codebase spells UTC as `timezone.utc` throughout; the `datetime.UTC`
    # alias would be a mechanical churn across every module for no gain.
    "UP017",
    # RunStatus is persisted through SQLAlchemy's Enum type; switching it to
    # enum.StrEnum would change how existing rows round-trip.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Test files import inside functions on purpose, to control settings ordering.
"tests/*" = ["E402"]
"tests/conftest.py" = ["E402"]
